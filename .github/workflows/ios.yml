name: iOS

on:
  # Simulator build check, only when the native/iOS side changes (macOS minutes are pricey).
  pull_request:
    paths: ['ios/**', 'package.json', 'package-lock.json', 'capacitor.config.json', 'scripts/**', '.github/workflows/ios.yml']
  # Actions tab -> iOS -> Run workflow: builds the current game and uploads it to TestFlight.
  workflow_dispatch:
    inputs:
      testflight:
        description: Sign and upload this build to TestFlight
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight && 'Build + upload to TestFlight' || 'Build (simulator)' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Bundle the web game into the iOS project
        run: |
          npm ci
          npm run ios:sync

      - name: Build for the iOS simulator (no signing)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.testflight) }}
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Write App Store Connect API key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v (see README, 'iOS app / TestFlight')"; exit 1; fi
          done
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive and upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/keys/AuthKey.p8"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Every upload needs a unique build number; the workflow run number always increases.
          BUILD=$(( 100 + GITHUB_RUN_NUMBER ))

          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" \
            "${AUTH[@]}" archive | tail -60

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -60
          echo "### Uploaded build $BUILD to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "It shows up in TestFlight after Apple finishes processing (usually 5-30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
